name: test

# The masternode claims three things this workflow exists to check on real
# machines: stdlib only (no install step beyond Python), ninja agrees with the
# merged tree, and it works on Windows as well as POSIX. A claim about Windows
# that no Windows machine has run is a guess.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Only the demo needs ninja; the library itself needs nothing. Installed
      # through pip here so Windows gets it too.
      - name: ninja
        run: python -m pip install --quiet ninja

      - name: unit tests
        run: python -m unittest discover -s test -v

      - name: demo (doctor -> fetch -> verify -> merge -> freshen -> ninja)
        run: python demo/run_demo.py

      - name: contract check against the producer, when it is beside us
        run: python demo/check_contract.py
        continue-on-error: true
